pywin32 = "306"
pyyaml = "6.0"
pyzmq = "25.1.0"
qm-qua = "^1.2.6"
qualang-tools = "0.19.1"
rfc3986 = "1.5.0"
scipy = "1.11.1"
serpent = "1.41"
six = "1.16.0"
sniffio = "1.3.0"
stack-data = "0.6.2"
tenacity = "8.2.2"
threadpoolctl = "3.6.0"
tinydb = "4.8.0"
tornado = "6.3.2"
