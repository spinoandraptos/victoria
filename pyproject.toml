[tool.poetry]
name = "project-template"
version = "1.0.0"
description = "Extensible template for measurement scripting with qcore"
authors = ["Qcrew <general.qcrew@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "config"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
qcore = {git = "https://github.com/Qcrew/qcore.git"}
anyio = "3.7.1"
asteval = "0.9.30"
asttokens = "2.2.1"
backcall = "0.2.0"
betterproto = "2.0.0b7"
certifi = "2023.5.7"
colorama = "0.4.6"
comm = "0.1.3"
contourpy = "1.1.0"
cycler = "0.11.0"
datadog-api-client = "2.14.0"
debugpy = "1.6.7"
decorator = "5.1.1"
dependency-injector = "4.41.0"
deprecation = "2.1.0"
exceptiongroup = "1.1.2"
executing = "1.2.0"
fonttools = "4.41.0"
future = "0.18.3"
grpcio = "1.78.0"
grpclib = "0.4.5"
h11 = "0.16.0"
h2 = "4.1.0"
h5py = "3.9.0"
hpack = "4.0.0"
httpcore = "1.0.9"
httpx = "0.28.1"
hyperframe = "6.0.1"
idna = "3.4"
ipykernel = "6.24.0"
ipython = "8.12.2"
jedi = "0.18.2"
joblib = "1.5.3"
jupyter-client = "8.3.0"
jupyter-core = "5.3.1"
kiwisolver = "1.4.4"
lmfit = "1.2.1"
loguru = "0.6.0"
marshmallow = "3.20.1"
marshmallow-polyfield = "5.11"
matplotlib-inline = "0.1.6"
multidict = "6.0.4"
nest-asyncio = "1.5.6"
numpy = "1.26.4"
packaging = "23.1"
parso = "0.8.3"
pickleshare = "0.7.5"
pillow = "10.0.0"
platformdirs = "3.8.1"
plotly = "5.15.0"
prompt-toolkit = "3.0.39"
